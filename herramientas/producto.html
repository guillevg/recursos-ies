<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiplicar y dividir fracciones</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.bunny.net">
<link rel="stylesheet" href="https://fonts.bunny.net/css?family=figtree:400,600,800&display=swap">
<link rel="stylesheet" href="pasos.css">
<style>
  .fino { stroke: var(--tinta); stroke-width: 0.8; stroke-dasharray: 3 3; }
  .grupo-contorno { fill: none; stroke: var(--naranja); stroke-width: 4; stroke-dasharray: 9 5; }
  .numero-grupo { font-size: 16px; text-anchor: middle; fill: var(--tinta); font-weight: 700; }
  .unidad { font-size: 15px; text-anchor: middle; fill: var(--suave); }
  .recta .eje { stroke: var(--tinta); stroke-width: 2.5; }
  .recta .muesca { stroke: var(--tinta); stroke-width: 2; }
  .recta .etq { font-size: 20px; text-anchor: middle; fill: var(--tinta); font-weight: 700; }
  .recta .etq.res { fill: var(--acento); }
  .recta .flecha { fill: none; stroke: var(--acento); stroke-width: 3; }
  .recta .punta { fill: var(--acento); }
  .recta .nota { font-size: 18px; text-anchor: middle; fill: var(--acento); font-weight: 700; }
  .rotulo-lado { font-size: 20px; text-anchor: start; fill: var(--tinta); font-weight: 700; }
</style>
<link rel="stylesheet" href="../herramientas.css">
<script>if (window.top !== window.self) document.documentElement.classList.add("en-modal", ...(location.hash.includes("=") ? ["con-datos"] : []));</script>
</head>
<body>
<header>
  <h1>Multiplicar y dividir fracciones</h1>
  <a href="../">← Volver al repaso</a>
</header>

<nav class="modos" role="tablist" aria-label="Operación">
  <button type="button" role="tab" data-modo="deUna">Multiplicar: fracción de una fracción</button>
  <button type="button" role="tab" data-modo="caben">Dividir: ¿cuántas veces cabe?</button>
  <button type="button" role="tab" data-modo="efecto">¿Mayor o menor?</button>
</nav>

<form class="entrada" id="entrada" autocomplete="off">
  <span data-para="deUna">
    <span class="frac-input"><input id="ma" class="corto" type="number" min="0" max="12" aria-label="Numerador de la primera fracción"><hr><input id="mb" class="corto" type="number" min="1" max="12" aria-label="Denominador de la primera fracción"></span>
    de
    <span class="frac-input"><input id="mc" class="corto" type="number" min="0" max="12" aria-label="Numerador de la segunda fracción"><hr><input id="md" class="corto" type="number" min="1" max="12" aria-label="Denominador de la segunda fracción"></span>
  </span>
  <span data-para="caben">
    <span class="frac-input"><input id="da" class="corto" type="number" min="1" max="96" aria-label="Numerador del dividendo"><hr><input id="db" class="corto" type="number" min="1" max="12" aria-label="Denominador del dividendo (1 si es un número entero)"></span>
    :
    <span class="frac-input"><input id="dc" class="corto" type="number" min="1" max="12" aria-label="Numerador del divisor"><hr><input id="dd" class="corto" type="number" min="1" max="12" aria-label="Denominador del divisor"></span>
  </span>
  <span data-para="efecto">
    <input id="en" type="number" min="1" max="99999" aria-label="Número">
    <select id="eo" aria-label="Operación"><option value="·">·</option><option value=":">:</option></select>
    <input id="ek" type="number" min="0" step="any" aria-label="Por o entre cuánto">
  </span>
  <button type="submit" class="principal">Empezar</button>
  <div class="ejemplos" id="ejemplos"></div>
</form>

<p class="enunciado" id="enunciado"></p>
<div id="escena" class="escena" aria-hidden="true"></div>

<section class="explicacion" aria-live="polite">
  <h2 id="titulo-paso"></h2>
  <div id="texto-paso"></div>
</section>

<div class="controles">
  <button type="button" id="anterior">← Anterior</button>
  <div class="puntos" id="puntos"></div>
  <button type="button" id="siguiente" class="principal">Siguiente →</button>
</div>
<p class="ayuda">También con las flechas ← → del teclado. Para dividir un número entero, pon 1 en su denominador (3 = 3/1).</p>

<script src="pasos.js"></script>
<script src="producto.js"></script>
<script>
"use strict";
const { svg, frac, num, X0, ANCHO, llave, texto } = Pasos;
const f = ([n, d]) => d === 1 ? `${n}` : frac(n, d);

// ------------------------------------------------- fracción de una fracción
function dibujarDeUna(r) {
  const { a, b, c, d, n, total, simple } = r;
  const g = Pasos.lienzo(330), W = 400, H = 240, x = 200, y = 30, cw = W / d, ch = H / b;
  for (let j = 0; j < d; j++) for (let i = 0; i < b; i++) {
    svg("rect", { x: x + j * cw, y: y + i * ch, width: cw + 0.3, height: ch + 0.3, class: "parte " + (j < c ? "azul" : "blanco") }, g);
    if (j < c && i < a) svg("rect", { x: x + j * cw, y: y + i * ch, width: cw + 0.3, height: ch + 0.3, class: "parte naranja ver2" }, g);
  }
  for (let j = 1; j < d; j++) svg("line", { x1: x + j * cw, y1: y, x2: x + j * cw, y2: y + H, class: "corte" }, g);
  for (let i = 1; i < b; i++) svg("line", { x1: x, y1: y + i * ch, x2: x + W, y2: y + i * ch, class: "corte ver1" }, g);
  svg("rect", { x, y, width: W, height: H, class: "contorno" }, g);
  svg("rect", { x: x + (d - 1) * cw, y: y + (b - 1) * ch, width: cw, height: ch, class: "resalte ver3 hasta4" }, g);
  llave(g, { x1: x, x2: x + c * cw, y, h: H, arriba: false, texto: `${c}/${d}` });
  if (a > 0) texto(g, { x: x + W + 14, y: y + a * ch / 2 + 6, t: `${a}/${b} de lo azul`, clase: "rotulo-lado ver2" });
  const s = simple[0] !== n;
  return [
    ["Pintamos la segunda fracción", `<p>Dibujamos ${frac(c, d)}: cortamos el rectángulo en ${d} columnas y pintamos ${c}.</p><p>Queremos ${frac(a, b)} <b>de</b> esa parte azul.</p>`],
    ["Cortamos en " + b, `<p>Para coger ${frac(a, b)} de lo azul, cortamos el rectángulo en ${b} filas iguales.</p>`],
    ["Marcamos " + a + " de " + b, `<p>Dentro de lo azul, marcamos ${a} de las ${b} filas (en naranja): eso es ${frac(a, b)} de ${frac(c, d)}.</p>`],
    ["¿De qué tamaño es cada trozo?", `<p>Ahora el rectángulo entero tiene ${b} · ${d} = <b>${total}</b> trozos iguales (el marcado en rojo es uno). Los naranjas son ${a} · ${c} = <b>${n}</b>.</p>`],
    ["Resultado", `<p>${frac(a, b)} de ${frac(c, d)} = ${frac(a, b)} · ${frac(c, d)} = ${frac(`${a} · ${c}`, `${b} · ${d}`)} = <b>${frac(n, total)}</b>${s ? ` = <b>${f(simple)}</b>` : ""}</p>
      <p>Se multiplican los numeradores (los trozos marcados) y los denominadores (los trozos en total). «De» quiere decir <b>multiplicar</b>.</p>
      <p>El resultado es <b>más pequeño</b> que ${frac(c, d)}: multiplicar por una fracción menor que 1 hace más pequeño.</p>`],
  ];
}

// ----------------------------------------------------------- ¿cuántas caben?
function dibujarCaben(r) {
  const { a, b, c, d, m, A, C, unidades, enteras, sobra, cociente, sobraFrac } = r;
  const g = Pasos.lienzo(240), y = 90, h = 60, total = unidades * m, p = ANCHO / total, uw = ANCHO / unidades;
  for (let k = 0; k < total; k++) svg("rect", { x: X0 + k * p, y, width: p + 0.3, height: h, class: "parte " + (k < A ? "azul" : "blanco") }, g);
  // Grupos del tamaño del divisor, en naranja uno sí y otro no; lo que sobra, en gris.
  for (let q = 0; q <= enteras; q++) {
    const desde = q * C, hasta = Math.min(A, desde + C);
    if (desde >= A) break;
    const resto = hasta - desde < C;
    if (resto) svg("rect", { x: X0 + desde * p, y, width: (hasta - desde) * p, height: h, class: "parte gris ver3" }, g);
    else if (q % 2 === 0) svg("rect", { x: X0 + desde * p, y, width: C * p, height: h, class: "parte naranja " + (q === 0 ? "ver2" : "ver3") }, g);
    if (!resto) texto(g, { x: X0 + (desde + C / 2) * p, y: y - 10, t: q + 1, clase: "numero-grupo " + (q === 0 ? "ver2" : "ver3") });
  }
  // Si no cabe ni un grupo entero, el grupo se ve como un contorno naranja más largo que lo azul.
  if (enteras === 0) svg("rect", { x: X0, y: y - 4, width: Math.min(C, total) * p, height: h + 8, rx: 4, class: "grupo-contorno ver2" }, g);
  for (let k = 1; k < total; k++) if (k % m) svg("line", { x1: X0 + k * p, y1: y, x2: X0 + k * p, y2: y + h, class: "fino ver1" }, g);
  for (let u = 1; u < unidades; u++) svg("line", { x1: X0 + u * uw, y1: y, x2: X0 + u * uw, y2: y + h, class: "corte" }, g);
  svg("rect", { x: X0, y, width: ANCHO, height: h, class: "contorno" }, g);
  for (let u = 0; u <= unidades; u++) texto(g, { x: X0 + u * uw, y: y + h + 22, t: u, clase: "unidad" });
  llave(g, { x1: X0, x2: X0 + A * p, y: y - 20, h, arriba: true, texto: `${b === 1 ? a : a + "/" + b}` });
  llave(g, { x1: X0, x2: X0 + C * p, y: y + 32, h, arriba: false, texto: `${c}/${d}`, clase: "ver2" });
  const div = b === 1 ? `${a}` : frac(a, b);
  // Sin grupos enteros, el resultado es solo la parte de grupo (nada de «0 y …»);
  // con grupos y sobra, enteros + parte, que se lee como una suma.
  const parteGrupo = frac(sobraFrac[0], sobraFrac[1]);
  const resultado = sobra === 0 ? `<b>${enteras}</b>` : enteras === 0 ? `<b>${f(cociente)}</b>` : `${enteras} + ${parteGrupo} = <b>${f(cociente)}</b>`;
  const cuantos = enteras === 0
    ? `<p>No cabe ni un grupo entero: los ${A} ${A === 1 ? "trozo azul" : "trozos azules"} (en gris) son ${A} de los ${C} trozos de un grupo, es decir, ${parteGrupo} de grupo.</p>`
    : `<p>Vamos poniendo grupos de ${C} trozos: caben <b>${enteras}</b> ${enteras === 1 ? "grupo" : "grupos"}${sobra ? ` y sobran ${sobra} ${sobra === 1 ? "trozo" : "trozos"} (en gris), que son ${parteGrupo} de grupo` : ""}.</p>`;
  const tamano = c < d ? `<p>Dividir entre una fracción menor que 1 da un resultado <b>más grande</b> que el dividendo: caben muchos trozos pequeños.</p>`
    : c > d ? `<p>Dividir entre una fracción mayor que 1 da un resultado <b>más pequeño</b> que el dividendo.</p>` : "";
  return [
    ["Lo que vamos a repartir", `<p>Dividir ${div} : ${frac(c, d)} es preguntarse: <b>¿cuántas veces cabe ${frac(c, d)} en ${div}?</b></p><p>En azul, ${div} ${a <= b && b > 1 ? "de una unidad" : "unidades"}.</p>`],
    ["Trozos del mismo tamaño", `<p>Cortamos cada unidad en <b>${m}</b> trozos iguales${m !== d ? ` (${m} es el m.c.m. de ${b} y ${d})` : ""}: así, ${div} son ${A} trozos y ${frac(c, d)} son ${C}.</p>`],
    ["Un grupo", enteras === 0
      ? `<p>Un grupo de ${frac(c, d)} ocupa ${C} trozos (el contorno naranja, con la llave): es más largo que lo azul, que son ${A}.</p>`
      : `<p>Un grupo de ${frac(c, d)} ocupa ${C} ${C === 1 ? "trozo" : "trozos"} (en naranja, con la llave).</p>`],
    ["¿Cuántos grupos caben?", cuantos],
    ["Resultado", `<p>${div} : ${frac(c, d)} = ${resultado}.</p>
      <p>Es lo mismo que multiplicar por la fracción dada la vuelta: ${div} · ${frac(d, c)} = ${f(cociente)}.</p>
      ${tamano}`],
  ];
}

// ¿Mayor o menor? El número y el resultado en la recta; una flecha de uno a otro.
function dibujarEfecto(r) {
  const { N, op, k, r: res, mayor, eq } = r;
  const g = Pasos.lienzo(200), recta = svg("g", { class: "recta" }, g), y = 120;
  const max = Math.max(N, res) * 1.12, x = v => Pasos.X0 + v / max * Pasos.ANCHO;
  svg("line", { x1: Pasos.X0, y1: y, x2: Pasos.X0 + Pasos.ANCHO, y2: y, class: "eje" }, recta);
  const marca = (v, clase, t) => {
    const m = svg("g", { class: clase }, recta);
    svg("line", { x1: x(v), y1: y - 9, x2: x(v), y2: y + 9, class: "muesca" }, m);
    Pasos.texto(m, { x: x(v), y: y + 36, t, clase: "etq" + (clase.includes("res") ? " res" : "") });
  };
  marca(0, "", "0");
  marca(N, "", num(N));
  // Flecha curva de N al resultado (paso 1) y el resultado (paso 2).
  const fl = svg("g", { class: "ver1" }, recta), x1 = x(N), x2 = x(res), alto = Math.min(70, Math.abs(x2 - x1) / 2 + 20);
  svg("path", { d: `M ${x1} ${y - 12} Q ${(x1 + x2) / 2} ${y - 12 - alto} ${x2} ${y - 12}`, class: "flecha" }, fl);
  // Punta en la dirección con la que llega el arco (del punto de control al final).
  const dx = x2 - (x1 + x2) / 2, dy = alto, l = Math.hypot(dx, dy), ux = dx / l, uy = dy / l, L = 14, A = 7;
  const bx = x2 - ux * L, by = y - 12 - uy * L;
  svg("path", { d: `M ${x2} ${y - 12} L ${bx - uy * A} ${by + ux * A} L ${bx + uy * A} ${by - ux * A} Z`, class: "punta" }, fl);
  Pasos.texto(fl, { x: (x1 + x2) / 2, y: y - 22 - alto, t: `${op} ${num(k)}`, clase: "nota" });
  marca(res, "ver2 res", num(res));
  const que = op === "·" ? (k < 1 ? `multiplicar por ${num(k)} es quedarse con <b>una parte</b> del número` : `multiplicar por ${num(k)} es tomar el número <b>más de una vez</b>`)
                         : (k < 1 ? `dividir entre ${num(k)} es ver <b>cuántas veces cabe</b> ${num(k)} en ${num(N)}: cabe muchas veces` : `dividir entre ${num(k)} es <b>repartir</b> en ${num(k)} partes iguales`);
  return [
    ["La operación", `<p>${num(N)} ${op} ${num(k)}: antes de calcular, ¿el resultado será mayor o menor que ${num(N)}?</p>`],
    [`${num(k)} es ${k < 1 ? "menor" : "mayor"} que 1`, `<p>${que.charAt(0).toUpperCase() + que.slice(1)}. Por eso el resultado es <b>${mayor ? "mayor" : "menor"}</b> que ${num(N)}.</p>`],
    ["El cálculo", `<p>${num(N)} ${op} ${num(k)}${eq ? ` = ${num(N)} ${eq}` : ""} = <b>${num(res)}</b>.</p>${eq ? `<p>${op === "·" ? "Multiplicar" : "Dividir"} ${op === "·" ? "por" : "entre"} ${num(k)} es lo mismo que ${eq.startsWith(":") ? "dividir entre" : "multiplicar por"} ${eq.slice(2)}.</p>` : ""}`],
    ["La regla", `<p>Multiplicar por un número menor que 1 hace el resultado más pequeño; dividir entre él, más grande. Con un número mayor que 1, al revés.</p>`],
  ];
}

const MODOS = {
  deUna: { campos: { a: "ma", b: "mb", c: "mc", d: "md" }, dibujar: dibujarDeUna },
  caben: { campos: { a: "da", b: "db", c: "dc", d: "dd" }, dibujar: dibujarCaben },
  efecto: { campos: { N: "en", op: "eo", k: "ek" }, dibujar: dibujarEfecto },
};
for (const [m, def] of Object.entries(MODOS))
  Object.assign(def, { calcular: Producto.calcular[m], ejemplos: Producto.EJEMPLOS[m], azar: () => Producto.azar(m) });
const elegirModo = Pasos.montar(MODOS, "deUna");
</script>
</body>
</html>

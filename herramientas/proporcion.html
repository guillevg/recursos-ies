<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proporcionalidad paso a paso</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.bunny.net">
<link rel="stylesheet" href="https://fonts.bunny.net/css?family=figtree:400,600,800&display=swap">
<link rel="stylesheet" href="pasos.css">
<style>
  .pieza { transform: translate(var(--x0), var(--y0)); transition: transform calc(var(--t) * 1.5) ease-in-out; }
  .s1 .pieza { transform: translate(var(--x1), var(--y1)); }
  .s3 .pieza { transform: translate(var(--x3), var(--y3)); }
  .tramo { stroke: none; }
  .marco { fill: none; stroke: var(--tinta); stroke-width: 2.5; }
  /* Los contornos nuevos aparecen cuando los tramos ya han llegado. */
  .s1 .marco.ver1, .s3 .marco.ver3 { transition-delay: calc(var(--t) * 1.3); }
  .hora { stroke: var(--tinta); stroke-width: 0.8; opacity: .45; }
  .corte-nuevo { stroke: var(--rojo); stroke-width: 3; stroke-dasharray: 7 5; }
  table.flechas { border-collapse: collapse; margin: .3em 0 .6em; }
  table.flechas th { text-align: right; padding-right: .8em; font-weight: 400; }
  table.flechas td { text-align: center; padding: .15em .4em; font-size: 1.1em; }
  table.flechas td.op { color: var(--rojo); font-size: .95em; }
  .etq-lado { font-size: 17px; fill: var(--tinta); }
  .etq-lado.medio { text-anchor: middle; }
  .grande { font-size: 22px; text-anchor: middle; fill: var(--tinta); font-weight: 700; }
  .nombre-fila { font-size: 17px; text-anchor: end; fill: var(--tinta); font-weight: 700; }
  .total-fila { font-size: 18px; text-anchor: start; fill: var(--rojo); font-weight: 700; }
  .oferta { font-size: 18px; text-anchor: start; fill: var(--tinta); font-weight: 700; }
  .mov { transform: translateX(var(--p0)); transition: transform calc(var(--t) * 1.5) ease-in-out, opacity var(--t); }
  .s1 .mov { transform: translateX(var(--p1)); }
  .s2 .mov { transform: translateX(var(--p2)); }
  .s3 .mov { transform: translateX(var(--p3)); }
  .eje-precio { stroke: var(--tinta); stroke-width: 2.5; }
  .regla { stroke: var(--tinta); stroke-width: 2.2; }
  .regla.menor { stroke-width: 1.2; }
  .etq-precio { font-size: 15px; text-anchor: middle; fill: var(--tinta); }
  .etq-precio.peque { font-size: 12px; fill: #666; }
  .tri { stroke: var(--tinta); stroke-width: 1.5; }
  .tri.azul { fill: var(--azul); } .tri.naranja { fill: var(--naranja); }
  .tri.fantasma { fill-opacity: .4; stroke-opacity: .45; }
  .etq-oferta, .etq-oferta-t { font-size: 16px; text-anchor: middle; fill: var(--tinta); }
  .etq-oferta-t { font-weight: 700; }
  .mov.fantasma-g { transition: transform calc(var(--t) * 1.5) ease-in-out, opacity calc(var(--t) * 1.5) ease-in; }
  .s3 .gana { fill: var(--rojo); font-weight: 700; }
  .celda { fill: none; stroke: var(--tinta); stroke-width: 1.2; }
  .celda.cabeza { fill: #f1f4f6; }
  .val-tabla { font-size: 19px; text-anchor: middle; fill: var(--tinta); }
  .val-tabla.calc { fill: var(--suave); font-size: 17px; }
  .s3 .val-tabla.calc.constante { fill: var(--rojo); font-weight: 700; }
  .rotulo-tabla { font-size: 17px; text-anchor: end; fill: var(--tinta); font-weight: 700; }
  .gratis { fill: url(#rayas-oferta); }
  .rayas { stroke: #c9d1d7; stroke-width: 3; }
</style>
<link rel="stylesheet" href="../herramientas.css">

<body>
<header>
  <h1>Proporcionalidad paso a paso</h1>
  <a href="../">← Volver al repaso</a>
</header>

<nav class="modos" role="tablist" aria-label="Tipo de problema">
  <button type="button" role="tab" data-modo="directa">Directa</button>
  <button type="button" role="tab" data-modo="escala">Escalas</button>
  <button type="button" role="tab" data-modo="inversa">Inversa</button>
  <button type="button" role="tab" data-modo="tabla">¿Es proporcional?</button>
  <button type="button" role="tab" data-modo="reparto">Reparto proporcional</button>
  <button type="button" role="tab" data-modo="barato">¿Cuál sale más barato?</button>
  <button type="button" role="tab" data-modo="oferta">Ofertas</button>
</nav>

<form class="entrada" id="entrada" autocomplete="off">
  <span data-para="directa"><input id="da" type="number" min="0" step="any" class="corto" aria-label="Primera cantidad"> <input id="dua" type="text" size="7" aria-label="Unidad de la primera magnitud">
    → <input id="db" type="number" min="0" step="any" class="corto" aria-label="Segunda cantidad"> <input id="dub" type="text" size="7" aria-label="Unidad de la segunda magnitud">;
    ¿y <input id="dx" type="number" min="0" step="any" class="corto" aria-label="Cantidad nueva">?</span>
  <span data-para="escala">escala 1 : <input id="ee" type="number" min="1" step="any" aria-label="Denominador de la escala">;
    <select id="es" aria-label="Qué se busca"><option value="real">en el plano mide</option><option value="plano">en la realidad mide</option></select>
    <input id="em" type="number" min="0" step="any" class="corto" aria-label="Medida que se conoce">
    <select id="eu" aria-label="Unidad de la realidad"><option value="m">(realidad en m)</option><option value="km">(realidad en km)</option></select></span>
  <span data-para="inversa"><input id="ia" type="number" min="0" step="any" class="corto" aria-label="Primera cantidad"> <input id="iua" type="text" size="7" aria-label="Unidad de la primera magnitud">
    tardan <input id="ib" type="number" min="0" step="any" class="corto" aria-label="Segunda cantidad"> <input id="iub" type="text" size="5" aria-label="Unidad de la segunda magnitud">;
    ¿y <input id="ix" type="number" min="0" step="any" class="corto" aria-label="Cantidad nueva">?</span>
  <span data-para="tabla"><input id="tux" type="text" size="5" aria-label="Unidad de la primera fila"> <input id="tx" type="text" size="16" aria-label="Valores de la primera fila, separados por espacios">;
    <input id="tuy" type="text" size="5" aria-label="Unidad de la segunda fila"> <input id="ty" type="text" size="16" aria-label="Valores de la segunda fila, separados por espacios"></span>
  <span data-para="reparto">partes <input id="r1" type="number" min="1" class="corto" aria-label="Primera parte"> <input id="r2" type="number" min="1" class="corto" aria-label="Segunda parte"> <input id="r3" type="number" min="0" class="corto" aria-label="Tercera parte (0 si no hay)">;
    total <input id="rt" type="number" min="0" step="any" aria-label="Total que se reparte"> <input id="rn" type="text" size="16" aria-label="Nombres separados por comas"></span>
  <span data-para="barato">A: <input id="bqa" type="number" min="0" step="any" class="corto" aria-label="Cantidad de la oferta A"> por <input id="bpa" type="number" min="0" step="any" class="corto" aria-label="Precio de la oferta A"> €;
    B: <input id="bqb" type="number" min="0" step="any" class="corto" aria-label="Cantidad de la oferta B"> por <input id="bpb" type="number" min="0" step="any" class="corto" aria-label="Precio de la oferta B"> €;
    unidad: <input id="bu" type="text" size="6" aria-label="Unidad"></span>
  <span data-para="oferta">1 unidad: <input id="op" type="number" min="0" step="any" class="corto" aria-label="Precio de una unidad"> €;
    <select id="ot" aria-label="Tipo de oferta"><option value="lleva">lleva a, paga b</option><option value="segunda">2ª unidad al a % menos</option></select>
    a = <input id="oa" type="number" min="0" step="any" class="corto" aria-label="a"> b = <input id="ob" type="number" min="0" class="corto" aria-label="b (solo en «lleva a, paga b»)"></span>
  <button type="submit" class="principal">Empezar</button>
  <div class="ejemplos" id="ejemplos"></div>
</form>

<p class="enunciado" id="enunciado"></p>
<div id="escena" class="escena" aria-hidden="true"></div>

<section class="explicacion" aria-live="polite">
  <h2 id="titulo-paso"></h2>
  <div id="texto-paso"></div>
</section>

<div class="controles">
  <button type="button" id="anterior">← Anterior</button>
  <div class="puntos" id="puntos"></div>
  <button type="button" id="siguiente" class="principal">Siguiente →</button>
</div>
<p class="ayuda">También con las flechas ← → del teclado.</p>

<script src="pasos.js"></script>
<script src="proporcion.js"></script>
<script>
"use strict";
const { svg, num, texto, X0, ANCHO, ALTO, llave } = Pasos;
const con = (v, u) => u ? `${num(v)} ${u}` : num(v);

// ------------------------------------------------------------------ directa
function dibujarDirecta(r) {
  const { a, b, x, ua, ub, k, y } = r;
  const g = Pasos.lienzo(230);
  const R = Pasos.rectaDoble(g, { y: 70, max: Math.max(a, x) * 1.12, formato: v => con(v, ua) });
  R.marca(0, con(0, ub));
  R.marca(a, con(b, ub));
  if (a !== 1) R.marca(1, con(k, ub), "ver1");
  R.marca(x, con(y, ub), "ver2", true);
  return [
    ["Lo que sabemos", `<p>${con(a, ua)} → ${con(b, ub)}. Arriba, ${ua || "la primera magnitud"}; abajo, ${ub || "la segunda"}. Si una se duplica, la otra también: es <b>proporcionalidad directa</b>.</p>`],
    ["Reducción a la unidad", `<p>Dividimos las dos entre ${num(a)}: a 1${ua ? " " + ua.replace(/s$/, "") : ""} le corresponde ${num(b)} : ${num(a)} = <b>${con(k, ub)}</b>.</p>`],
    [`Para ${con(x, ua)}`, `<p>Multiplicamos las dos por ${num(x)}: ${num(x)} · ${num(k)} = <b>${con(y, ub)}</b>.</p>`],
    ["La constante", `<p>En toda la recta, abajo es <b>${num(k)} veces</b> arriba: es la constante de proporcionalidad. ${con(x, ua)} → ${num(x)} · ${num(k)} = ${con(y, ub)}.</p>
      <p>Comprobación: ${num(b)} : ${num(a)} = ${num(y)} : ${num(x)} = ${num(k)}.</p>`],
  ];
}

// ------------------------------------------------------------------ escala
// Recta doble: arriba el plano (cm), abajo la realidad (m o km). Lo que se
// conoce lleva «?» en la otra recta hasta el paso 2.
function dibujarEscala(r) {
  const { e, medida, sentido, unidad, f, uno, plano, real } = r;
  const g = Pasos.lienzo(230);
  const R = Pasos.rectaDoble(g, { y: 70, max: Math.max(plano, 1) * 1.18, formato: v => `${num(v)} cm` });
  R.marca(0, con(0, unidad));
  R.marca(1, con(uno, unidad), "ver1");
  const buscaReal = sentido === "real";
  R.marca(plano, buscaReal ? "?" : con(real, unidad), "hasta2", false, buscaReal ? {} : { etiqueta: "?" });
  R.marca(plano, con(real, unidad), "ver2", true, { repite: true });
  const nombreU = unidad === "km" ? "kilómetros" : "metros";
  const e_ = num(e);
  return [
    [`La escala 1 : ${e_}`, `<p><b>1 cm</b> del plano son <b>${e_} cm</b> de la realidad: todo se ha dibujado ${e_} veces más pequeño. Arriba, el plano (cm); abajo, la realidad (${unidad}).</p>
      <p>${buscaReal ? `En el plano mide ${num(medida)} cm. ¿Cuánto mide en la realidad?` : `En la realidad mide ${con(medida, unidad)}. ¿Cuánto mide en el plano?`}</p>`],
    ["1 cm del plano", `<p>${e_} cm de la realidad, en ${nombreU}: ${e_} : ${num(f)} = <b>${con(uno, unidad)}</b>. ${unidad === "km" ? "De cm a km se divide entre 100 000 (se quitan cinco ceros)." : "De cm a m se divide entre 100 (se quitan dos ceros)."}</p>
      <p>Así que <b>1 cm del plano son ${con(uno, unidad)}</b>.</p>`],
    buscaReal
      ? ["En la realidad", `<p>Si 1 cm son ${con(uno, unidad)}, ${num(plano)} cm son ${num(plano)} veces más: ${num(plano)} · ${num(uno)} = <b>${con(real, unidad)}</b>.</p>`]
      : ["En el plano", `<p>¿Cuántas veces caben ${con(uno, unidad)} en ${con(real, unidad)}? ${num(real)} : ${num(uno)} = <b>${num(plano)} cm</b>.</p>`],
    ["Comprobación", `<p>${num(plano)} cm · ${e_} = ${num(plano * e)} cm de la realidad = ${con(real, unidad)}.</p>
      <p>Error típico: no cambiar de unidad y dar ${num(plano * e)} como si fueran ${unidad}${buscaReal ? "" : `, o multiplicar en lugar de dividir`}.</p>`],
  ];
}

// ------------------------------------------------------------------ inversa
// Barras de tiempo: una por cada uno (paso 0); se ponen una detrás de otra,
// lo que tardaría uno solo (paso 1); se corta en x trozos iguales (paso 2) y
// los trozos bajan a x filas (paso 3). Cada tramo (r.piezas) conserva el
// color de quien lo hacía al principio y se mueve con una transición CSS
// entre sus tres posiciones (--x0/--y0, --x1/--y1, --x3/--y3).
function dibujarInversa(r) {
  const { a, b, x, ua, ub, total, y, filas, piezas, horas } = r;
  const mas = x > a, uno = ua ? ua.replace(/(es|s)$/, "") : "";
  const tabla = `<table class="flechas"><tr><th>${ua || "1ª magnitud"}</th><td>${num(a)}</td><td class="op">: ${num(a)} →</td><td>1</td><td class="op">· ${num(x)} →</td><td>${num(x)}</td></tr>
    <tr><th>${ub || "2ª magnitud"}</th><td>${num(b)}</td><td class="op">· ${num(a)} →</td><td>${num(total)}</td><td class="op">: ${num(x)} →</td><td><b>${num(y)}</b></td></tr></table>`;
  const pasos = [
    ["Lo que sabemos", `<p>${con(a, ua)} tardan ${con(b, ub)}. Cada barra es el tiempo de uno: trabajan todos a la vez, ${con(b, ub)} cada uno. Cuantos más son, <b>menos</b> tardan: es <b>proporcionalidad inversa</b>.</p>`],
    [`Uno solo`, `<p>Si lo hiciera ${uno ? `1 ${uno}` : "uno"} solo, tendría que hacer también lo de los demás: ponemos las barras una detrás de otra. Tardaría ${num(a)} · ${num(b)} = <b>${con(total, ub)}</b>.</p>
      <p>Para ir a la unidad, aquí se <b>multiplica</b>; en la directa se dividía.</p>`],
    [`Repartir entre ${num(x)}`, `<p>Ahora son ${con(x, ua)}: repartimos esas ${con(total, ub)} en ${num(x)} trozos iguales. ${num(total)} : ${num(x)} = <b>${num(y)}</b>.</p>`],
    [`Con ${con(x, ua)}`, `<p>Cada uno tarda <b>${con(y, ub)}</b>. Con ${mas ? "más" : "menos"} ${ua || "de los primeros"}, ${mas ? "menos" : "más"} ${ub || "de los segundos"}.</p>`],
    ["Comprobación", `${tabla}<p>Si una se divide, la otra se multiplica por lo mismo. El producto no cambia: ${num(a)} · ${num(b)} = ${num(x)} · ${num(y)} = ${num(total)}.</p>`],
  ];
  if (!filas) {   // muchos o no enteros: sin barras, solo las cuentas
    const g = Pasos.lienzo(150);
    texto(g, { x: 400, y: 40, t: `${con(a, ua)} → ${con(b, ub)}`, clase: "grande" });
    texto(g, { x: 400, y: 85, t: `Uno solo: ${num(a)} · ${num(b)} = ${con(total, ub)}`, clase: "grande ver1" });
    texto(g, { x: 400, y: 130, t: `${con(x, ua)}: ${num(total)} : ${num(x)} = ${con(y, ub)}`, clase: "grande ver2" });
    return pasos;
  }
  const L = 120, W = 620, u = W / total, H = 34, PASO = 48, TOP = 54;
  const n = Math.max(a, x);
  const g = Pasos.lienzo(Math.max(TOP + n * PASO + 16, TOP + H + 110));
  texto(g, { x: L - 14, y: 26, t: ua, clase: "etq-lado", ancla: "end" });
  for (let k = 0; k < n; k++) {
    const yy = TOP + k * PASO + H / 2 + 6;
    if (k === 0) texto(g, { x: L - 14, y: yy, t: "1", clase: "nombre-fila", ancla: "end" });
    else {
      if (k < a) texto(g, { x: L - 14, y: yy, t: String(k + 1), clase: "nombre-fila hasta1", ancla: "end" });
      if (k < x) texto(g, { x: L - 14, y: yy, t: String(k + 1), clase: "nombre-fila ver3", ancla: "end" });
    }
    if (k < a) texto(g, { x: L + b * u + 12, y: yy, t: con(b, ub), clase: "etq-lado hasta1", ancla: "start" });
    if (k < x) texto(g, { x: L + y * u + 12, y: yy, t: con(y, ub), clase: "total-fila ver3", ancla: "start" });
  }
  for (const p of piezas) {
    const t = svg("g", { class: "pieza", style: [
      `--x0:${(L + p.oi * u).toFixed(2)}px`, `--y0:${TOP + p.i * PASO}px`,
      `--x1:${(L + p.s * u).toFixed(2)}px`, `--y1:${TOP}px`,
      `--x3:${(L + p.oj * u).toFixed(2)}px`, `--y3:${TOP + p.j * PASO}px`].join(";") }, g);
    svg("rect", { x: 0, y: 0, width: p.len * u + 0.4, height: H, class: `tramo ${p.i % 2 ? "naranja" : "azul"}` }, t);
    if (horas) for (let h = 1; h < p.len; h++) svg("line", { x1: h * u, y1: 0, x2: h * u, y2: H, class: "hora" }, t);
  }
  // Contornos de cada paso (los tramos no llevan, para no adelantar los cortes):
  // las barras de cada uno; la barra larga con las separaciones entre ellos; las filas nuevas.
  for (let k = 0; k < a; k++) svg("rect", { x: L, y: TOP + k * PASO, width: b * u, height: H, class: "marco hasta1" }, g);
  svg("rect", { x: L, y: TOP, width: W, height: H, class: "marco ver1 hasta3" }, g);
  for (let i = 1; i < a; i++) svg("line", { x1: L + i * b * u, y1: TOP, x2: L + i * b * u, y2: TOP + H, class: "marco ver1 hasta3" }, g);
  for (let k = 0; k < x; k++) svg("rect", { x: L, y: TOP + k * PASO, width: y * u, height: H, class: "marco ver3" }, g);
  // Uno solo y el reparto, debajo de la barra larga (en los pasos 1 y 2 las demás filas están vacías).
  texto(g, { x: L + W / 2, y: TOP + H + 40, t: `Uno solo: ${num(a)} · ${num(b)} = ${con(total, ub)}`, clase: "grande ver1 hasta3" });
  for (let j = 1; j < x; j++) svg("line", { x1: L + j * y * u, y1: TOP - 10, x2: L + j * y * u, y2: TOP + H + 10, class: "corte-nuevo ver2 hasta3" }, g);
  texto(g, { x: L + W / 2, y: TOP + H + 80, t: `${num(total)} : ${num(x)} = ${con(y, ub)} cada uno`, clase: "grande ver2 hasta3" });
  return pasos;
}

// ------------------------------------------------------------------ tabla
// ¿Es proporcional? La tabla con dos filas calculadas debajo: y : x (paso
// 1) y x · y (paso 2); si lo que no cambia es la diferencia, y − x (paso 3).
// En el paso 3, la fila constante en rojo.
function dibujarTabla(r) {
  const { xs, ys, ux, uy, cocientes, productos, difs, tipo, suma } = r;
  const n = xs.length, L = 230, cw = Math.min(120, (X0 + ANCHO - L) / n), h = 46, top = 16;
  const filas = [
    [ux || "1ª magnitud", xs, ""], [uy || "2ª magnitud", ys, ""],
    [ux && uy ? `${uy} : ${ux}` : "2ª : 1ª", cocientes, `calc ver1${tipo === "directa" ? " constante" : ""}`],
    [ux && uy ? `${ux} · ${uy}` : "1ª · 2ª", productos, `calc ver2${tipo === "inversa" ? " constante" : ""}`],
  ];
  if (suma) filas.push(["Diferencia", difs, "calc ver3 constante"]);
  const g = Pasos.lienzo(top + filas.length * h + 12);
  // Con dos decimales; si no es exacto, «≈».
  const aprox = v => (Math.abs(v * 100 - Math.round(v * 100)) > 1e-6 ? "≈ " : "") + num(v);
  filas.forEach(([rot, vals, clase], i) => {
    const y = top + i * h, extra = clase.split(" ").filter(c => /^ver/.test(c)).join(" ");
    texto(g, { x: L - 14, y: y + h / 2 + 6, t: rot, clase: `rotulo-tabla ${extra}`, ancla: "end" });
    vals.forEach((v, k) => {
      svg("rect", { x: L + k * cw, y, width: cw, height: h, class: `celda ${i < 2 ? "" : extra}` }, g);
      texto(g, { x: L + (k + 0.5) * cw, y: y + h / 2 + 7, t: i < 2 ? num(v) : aprox(v), clase: `val-tabla ${clase}` });
    });
  });
  const crece = ys[ys.length - 1] > ys[0] === xs[xs.length - 1] > xs[0];
  const nombre = { directa: "Es <b>proporcionalidad directa</b>.", inversa: "Es <b>proporcionalidad inversa</b>.", ninguna: "<b>No es proporcional</b>: ni directa ni inversa." }[tipo];
  const igual = l => l.every(v => Math.abs(v - l[0]) < 1e-6);
  return [
    ["La tabla", `<p>Cuando la primera ${crece ? "crece, la segunda también crece" : "crece, la segunda decrece"}. Pero eso no basta: hay que ver si se <b>multiplica</b> (o se divide) por lo mismo.</p>`],
    ["Los cocientes", `<p>Dividimos la segunda entre la primera en cada columna. ${igual(cocientes) ? `Siempre da <b>${aprox(cocientes[0])}</b>: el cociente es constante.` : "No siempre da lo mismo: <b>no es directa</b>."}</p>`],
    ["Los productos", `<p>Multiplicamos la primera por la segunda. ${igual(productos) ? `Siempre da <b>${aprox(productos[0])}</b>: el producto es constante.` : "No siempre da lo mismo: <b>no es inversa</b>."}</p>`],
    ["Conclusión", `<p>${nombre}</p>` + (tipo === "directa" ? `<p>La constante de proporcionalidad es ${aprox(cocientes[0])}: la segunda es siempre ${aprox(cocientes[0])} veces la primera.</p>`
      : tipo === "inversa" ? `<p>El producto, ${aprox(productos[0])}, no cambia: el doble de una, la mitad de la otra.</p>`
      : suma ? `<p>Lo que no cambia es la <b>diferencia</b> (${num(difs[0])}): se suma lo mismo a las dos, no se multiplica. Así pasa con las edades de dos personas.</p>`
      : `<p>Ni el cociente ni el producto son constantes.${crece ? " A menudo hay una parte fija que no depende de la cantidad (la bajada de bandera de un taxi, una cuota)." : ""}</p>`)],
  ];
}

// ------------------------------------------------------------------ reparto
function dibujarReparto(r) {
  const { ps, total, suma, u, cada, nombres } = r;
  const g = Pasos.lienzo(110 + ps.length * 80);
  const xi = X0 + 130, w = Math.min(60, (ANCHO - 280) / Math.max(...ps));
  const colores = ["azul", "naranja", "gris"];
  ps.forEach((p, i) => {
    const y = 60 + i * 80;
    texto(g, { x: xi - 14, y: y + 34, t: nombres[i], clase: "nombre-fila", ancla: "end" });
    const pw = Pasos.barra(g, { x: xi, y, w: p * w, partes: p, color: () => colores[i] });
    Pasos.valores(g, { x: xi, y, p: pw, desde: 0, hasta: p, texto: num(u), clase: "ver2" });
    texto(g, { x: xi + p * w + 14, y: y + 34, t: `${p} ${p === 1 ? "parte" : "partes"}`, clase: "etq-lado hasta3", ancla: "start" });
    texto(g, { x: xi + p * w + 14, y: y + 34, t: `${p} · ${num(u)} = ${num(cada[i])}`, clase: "total-fila ver3", ancla: "start" });
  });
  texto(g, { x: 400, y: 30, t: `En total, ${suma} partes = ${num(total)}`, clase: "grande ver1" });
  return [
    ["Las partes", `<p>Cada uno recibe en proporción a lo que le corresponde: ${ps.map((p, i) => `${nombres[i]}, ${p}`).join("; ")}. Dibujamos una barra por persona, con trozos iguales.</p>`],
    ["Todas las partes juntas", `<p>Entre todos hay ${ps.join(" + ")} = <b>${suma}</b> partes iguales, que son el total: ${num(total)}.</p>`],
    ["Una parte", `<p>Cada parte vale ${num(total)} : ${suma} = <b>${num(u)}</b>.</p>`],
    ["Lo de cada uno", `<p>${ps.map((p, i) => `${nombres[i]}: ${p} · ${num(u)} = <b>${num(cada[i])}</b>`).join("; ")}.</p>
      <p>Comprobación: ${cada.map(num).join(" + ")} = ${num(total)}. Error típico: repartir a partes iguales (${num(total / ps.length)} cada uno).</p>`],
  ];
}

// ------------------------------------------------------------------ barato
// Una sola recta de precios: ▼ el total de A (arriba) y ▲ el de B (abajo).
// Un «fantasma» de cada triángulo se desliza hasta el precio de 1 unidad
// (pasos 1 y 2); en el paso 3 la recta se estira hasta la zona de los
// precios unitarios (los totales salen por la derecha).
// Lo que se mueve lleva la clase `mov` y su x de cada paso en --p0…--p3.
function escalaBonita(max, marcas = 6) {
  const bruto = max / marcas, e = 10 ** Math.floor(Math.log10(bruto));
  return [1, 2, 2.5, 5, 10].map(f => f * e).find(f => f >= bruto);
}
function dibujarBarato(r) {
  const { qa, pa, qb, pb, unidad, ua, ub, gana } = r;
  const pl = v => /^[a-záéíóúñ]{3,}$/i.test(unidad) && v !== 1 ? unidad + (/[aeiouáéíóú]$/i.test(unidad) ? "s" : "es") : unidad;
  const Y = 170;
  // Euros: 0,80 € y no 0,8 €; sin decimales si es exacto.
  const eur = v => { const r = Math.round(v * 100) / 100; return Number.isInteger(r) ? num(r) : `${num(Math.trunc(r))},${r.toFixed(2).split(".")[1]}`; };
  const g = Pasos.lienzo(330);
  // Fin de la recta (E) y del zoom (Z): un poco más allá del precio mayor, en un valor redondo.
  const redondo = v => { const p = escalaBonita(v); return Math.ceil(v / p) * p; };
  const E = redondo(Math.max(pa, pb) * 1.08), Z = redondo(Math.max(ua, ub) * 1.3);
  const xN = v => X0 + v / E * ANCHO, xZ = v => X0 + v / Z * ANCHO;
  const f = n => n.toFixed(2) + "px";
  // Elemento que se mueve en horizontal: xs = su x en los pasos 0, 1, 2 y 3.
  const mov = (padre, xs, clase = "") => svg("g", { class: `mov ${clase}`, style: xs.map((x, k) => `--p${k}:${f(x)}`).join(";") }, padre);
  const recorte = svg("clipPath", { id: "recorte-barato" }, g);
  svg("rect", { x: X0 - 30, y: 0, width: ANCHO + 60, height: 600 }, recorte);
  // Marcas de la recta de 0 a max. Grandes, con su número: los euros enteros
  // (de 1 en 1, de 2 en 2, de 5 en 5…) o, si la recta no llega a 1 €, las
  // décimas o lo que toque. Pequeñas, entre las grandes (dividiéndolas en 10,
  // 5 o 2): con su número en pequeño si son decimales de una recta en euros.
  const marcas = (c, y, max, xs, clase) => {
    const grande = max >= 1 ? [1, 2, 5, 10, 20, 50, 100, 200, 500].find(f => f >= max / 6) : escalaBonita(max, 6);
    const peque = [10, 5, 2].map(d => grande / d).find(d => max / d <= 16) ?? grande;
    for (let k = 0; k * peque <= max + 1e-9; k++) {
      const v = Math.round(k * peque * 1e6) / 1e6, esGrande = Math.abs(v / grande - Math.round(v / grande)) < 1e-9;
      const m = mov(c, xs(v), clase);
      svg("line", { x1: 0, y1: y - (esGrande ? 11 : 6), x2: 0, y2: y + (esGrande ? 11 : 6), class: esGrande ? "regla" : "regla menor" }, m);
      if (esGrande) texto(m, { x: 0, y: y + 31, t: `${eur(v)} €`, clase: "etq-precio" });
      else if (max >= 1) texto(m, { x: 0, y: y + 29, t: `${eur(v)} €`, clase: "etq-precio peque" });
    }
  };
  // Triángulo ▼ (encima de la recta, sin pisar las marcas) o ▲ (debajo de
  // los números de la escala).
  const tri = (c, y, arriba, clase) => svg("path", { d: arriba ? `M -11 ${y - 33} H 11 L 0 ${y - 13} Z` : `M -11 ${y + 60} H 11 L 0 ${y + 40} Z`, class: `tri ${clase}` }, c);
  // Filas de los rótulos: «Oferta A» (1) y «6 yogures por 3,60 €» (2); las
  // mismas, más afuera (3 y 4), para el fantasma que acaba cerca del total.
  const fila_y = (y, arriba, n) => arriba ? y - [0, 62, 42, 106, 86][n] : y + [0, 80, 100, 124, 144][n];
  // Rótulo de dos líneas: «Oferta A» en negrita y el detalle debajo.
  const rotulo = (c, x, y, arriba, n, nombre, detalle, extra = "") => {
    texto(c, { x, y: fila_y(y, arriba, n), t: `Oferta ${nombre}`, clase: "etq-oferta-t" + extra });
    texto(c, { x, y: fila_y(y, arriba, n + 1), t: detalle, clase: "etq-oferta" + extra });
  };
  const fila = (nombre, q, p, u, arriba, color, pasoFantasma) => {
    // El total: quieto hasta el zoom (entonces sale por la derecha si no cabe).
    const t = mov(principal, [xN(p), xN(p), xN(p), xZ(p)]);
    tri(t, Y, arriba, color);
    // «Oferta A» y «6 yogures por 3,60 €», centrados sobre (o bajo) el triángulo;
    // cerca de los extremos, desplazados hacia dentro para que no se corten.
    const dx = Math.min(Math.max(xN(p), X0 + 80), X0 + ANCHO - 80) - xN(p);
    rotulo(t, dx, Y, arriba, 1, nombre, `${num(q)} ${pl(q)} por ${eur(p)} €`);
    // El fantasma: sale del total y se desliza hasta el precio de 1 unidad.
    const xs = [0, 1, 2, 3].map(k => k < pasoFantasma ? xN(p) : k < 3 ? xN(u) : xZ(u));
    // Entra transparente y se hace opaco mientras se desliza: el rótulo
    // comparte fila con el de la oferta y así el solape apenas se nota. Si
    // acaba demasiado cerca del total, el rótulo va una fila más afuera; si
    // la oferta ya es de 1 unidad, no lleva (sería el mismo).
    const fa = mov(principal, xs, `fantasma-g ver${pasoFantasma}`);
    tri(fa, Y, arriba, `${color} fantasma`);
    if (q !== 1) {
      const cerca = Math.abs(xN(u) - xN(p)) < 170;
      rotulo(fa, Math.min(Math.max(xN(u), X0 + 80), X0 + ANCHO - 80) - xN(u), Y, arriba, cerca ? 3 : 1, nombre, `1 ${unidad} por ${eur(u)} €`, gana === nombre ? " gana" : "");
    }
  };
  const principal = svg("g", { "clip-path": "url(#recorte-barato)" }, g);
  svg("line", { x1: X0, y1: Y, x2: X0 + ANCHO, y2: Y, class: "eje-precio" }, principal);
  // Al estirarse, las marcas de la escala grande se desvanecen; las finas llegan con el zoom.
  marcas(principal, Y, E, v => [xN(v), xN(v), xN(v), xZ(v)], "hasta3");
  marcas(principal, Y, Z, v => [xN(v), xN(v), xN(v), xZ(v)], "ver3");
  fila("A", qa, pa, ua, true, "azul", 1);
  fila("B", qb, pb, ub, false, "naranja", 2);
  const menos = pa < pb ? "A" : pa > pb ? "B" : null;
  return [
    ["Dos ofertas", `<p>A: ${num(qa)} ${pl(qa)} por ${eur(pa)} € (▼). B: ${num(qb)} ${pl(qb)} por ${eur(pb)} € (▲).${menos ? ` En total cuesta menos ${menos}, pero ${menos === "A" ? (qa < qb ? "trae menos" : "trae más") : (qb < qa ? "trae menos" : "trae más")}.` : ""} Con cantidades distintas no se pueden comparar los precios directamente.</p>`],
    [`1 ${unidad} de A`, `<p>Reducimos a la unidad: 1 ${unidad} de A cuesta ${eur(pa)} : ${num(qa)} = <b>${eur(ua)} €</b>.</p>`],
    [`1 ${unidad} de B`, `<p>1 ${unidad} de B cuesta ${eur(pb)} : ${num(qb)} = <b>${eur(ub)} €</b>.</p>`],
    ["Comparamos", `<p>Nos acercamos a la zona de los precios de 1 ${unidad}.</p>` +
      (gana === "igual" ? `<p>Las dos cuestan lo mismo por ${unidad}: ${eur(ua)} €.</p>` : `<p>Sale más barata <b>la oferta ${gana}</b>: ${eur(Math.min(ua, ub))} € por ${unidad}, ${eur(Math.abs(ua - ub))} € menos.</p>
      <p>Además del precio, cuenta si de verdad vas a gastar toda la cantidad antes de que se estropee.</p>`)],
  ];
}

// ------------------------------------------------------------------ oferta
// Una barra por unidad, con el precio encima. Paso 1: se pinta lo que se
// paga de cada una (lo gratis, rayado). Paso 2: todo junto en una barra, con
// la parte pagada. Paso 3: el descuento real.
function dibujarOferta(r) {
  const { precio, tipo, a, b, paga, n, partes, sin, total, ahorro, real, unidad, paga100 } = r;
  const eur = v => { const x = Math.round(v * 100) / 100; return Number.isInteger(x) ? num(x) : x.toFixed(2).replace(".", ","); };
  // Porcentaje con un decimal; cociente con tres y «…» si no es exacto.
  const pc = v => num(Math.round(v * 10) / 10) + " %";
  const dec = v => Math.abs(v * 1000 - Math.round(v * 1000)) > 1e-6 ? (Math.round(v * 1000) / 1000).toFixed(3).replace(".", ",") + "…" : num(v);
  const g = Pasos.lienzo(330);
  const defs = svg("defs", {}, g), pat = svg("pattern", { id: "rayas-oferta", width: 12, height: 12, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" }, defs);
  svg("rect", { width: 12, height: 12, fill: "#fff" }, pat);
  svg("line", { x1: 0, y1: 0, x2: 0, y2: 12, class: "rayas" }, pat);
  const gap = 24, w = Math.min(150, (ANCHO - gap * (n - 1)) / n), y1 = 50, H = ALTO;
  const x0 = X0 + (ANCHO - (n * w + (n - 1) * gap)) / 2;
  paga.forEach((f, i) => {
    const x = x0 + i * (w + gap);
    texto(g, { x: x + w / 2, y: y1 - 14, t: `${eur(precio)} €`, clase: "etq-lado medio" });
    if (f < 1) svg("rect", { x: x + f * w, y: y1, width: (1 - f) * w, height: H, class: "parte gratis ver1" }, g);
    if (f > 0) svg("rect", { x, y: y1, width: f * w, height: H, class: "parte azul desde1" }, g);
    svg("rect", { x, y: y1, width: w, height: H, class: "contorno" }, g);
    texto(g, { x: x + w / 2, y: y1 + H + 26, t: f === 1 ? `pagas ${eur(precio)} €` : f === 0 ? "gratis" : `pagas ${eur(f * precio)} €`, clase: "etq-lado medio ver1" });
  });
  // Todo junto: la barra de las n unidades, con lo que se paga en azul.
  const y2 = 200, W = Math.min(ANCHO, n * 150), xj = X0 + (ANCHO - W) / 2;
  const j = svg("g", { class: "ver2" }, g);
  svg("rect", { x: xj, y: y2, width: W, height: H, class: "parte gratis" }, j);
  svg("rect", { x: xj, y: y2, width: W * partes / n, height: H, class: "parte azul" }, j);
  for (let k = 1; k < n; k++) svg("line", { x1: xj + k * W / n, y1: y2, x2: xj + k * W / n, y2: y2 + H, class: "corte" }, j);
  svg("rect", { x: xj, y: y2, width: W, height: H, class: "contorno" }, j);
  Pasos.llave(j, { x1: xj, x2: xj + W * partes / n, y: y2, arriba: false, texto: `pagas ${num(partes)} de ${n}: ${pc(paga100)}` });
  if (partes < n) Pasos.llave(g, { x1: xj + W * partes / n, x2: xj + W, y: y2, arriba: true, texto: `descuento: ${pc(real)}`, clase: "ver3" });
  const nombre = tipo === "lleva" ? `«llévate ${a} y paga ${b}»` : `«2ª unidad al ${num(a)} % de descuento»`;
  return [
    ["La oferta", `<p>${nombre}, con cada unidad a ${eur(precio)} €. Sin oferta, ${n} unidades costarían ${n} · ${eur(precio)} = <b>${eur(sin)} €</b>.</p>`],
    ["Lo que pagas de cada una", tipo === "lleva"
      ? `<p>Pagas ${b} y ${a - b === 1 ? "la otra es gratis" : `las otras ${a - b} son gratis`}: ${b} · ${eur(precio)} = <b>${eur(total)} €</b>.</p>`
      : `<p>La primera, entera: ${eur(precio)} €. La segunda, con un ${num(a)} % menos: pagas el ${num(100 - a)} %, ${eur(paga[1] * precio)} €. En total, <b>${eur(total)} €</b>.</p>`],
    ["Todo junto", `<p>De las ${n} unidades pagas ${num(partes)}: ${num(partes)} : ${n} = ${dec(partes / n)}, el <b>${pc(paga100)}</b> de lo que costarían sin oferta. Cada unidad te sale a ${eur(unidad)} €.</p>`],
    ["El descuento real", `<p>Ahorras ${eur(sin)} − ${eur(total)} = ${eur(ahorro)} € de ${eur(sin)} €: ${eur(ahorro)} : ${eur(sin)} = ${dec(ahorro / sin)}, un <b>${pc(real)}</b> de descuento.</p>` +
      (tipo === "segunda" ? `<p>¡No es un ${num(a)} %! Ese descuento es solo de una de las dos unidades; repartido entre las dos, se queda en la mitad.</p>` : "")],
  ];
}

const MODOS = {
  directa: { campos: { a: "da", ua: "dua", b: "db", ub: "dub", x: "dx" }, dibujar: dibujarDirecta },
  escala: { campos: { e: "ee", sentido: "es", medida: "em", unidad: "eu" }, dibujar: dibujarEscala },
  inversa: { campos: { a: "ia", ua: "iua", b: "ib", ub: "iub", x: "ix" }, dibujar: dibujarInversa },
  tabla: { campos: { ux: "tux", x: "tx", uy: "tuy", y: "ty" }, dibujar: dibujarTabla },
  reparto: { campos: { p1: "r1", p2: "r2", p3: "r3", total: "rt", nombres: "rn" }, dibujar: dibujarReparto },
  barato: { campos: { qa: "bqa", pa: "bpa", qb: "bqb", pb: "bpb", unidad: "bu" }, dibujar: dibujarBarato },
  oferta: { campos: { precio: "op", tipo: "ot", a: "oa", b: "ob" }, dibujar: dibujarOferta },
};
for (const [m, def] of Object.entries(MODOS))
  Object.assign(def, { calcular: Proporcion.calcular[m], ejemplos: Proporcion.EJEMPLOS[m], azar: () => Proporcion.azar(m) });
const elegirModo = Pasos.montar(MODOS, "directa");
</script>

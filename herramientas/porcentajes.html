<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porcentajes con la recta doble</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.bunny.net">
<link rel="stylesheet" href="https://fonts.bunny.net/css?family=figtree:400,600,800&display=swap">
<link rel="stylesheet" href="pasos.css">
<style>
  .nombre-eje { font-size: 14px; fill: var(--suave); text-anchor: start; }
  .salto { fill: none; stroke: var(--acento); stroke-width: 2; }
  .salto-txt { font-size: 15px; text-anchor: middle; fill: var(--acento); font-weight: 700; }
  .caja-valor { fill: var(--fondo-alt); stroke: var(--tinta); stroke-width: 2; }
  .valor-caja { font-size: 24px; text-anchor: middle; dominant-baseline: central; fill: var(--tinta); font-weight: 700; }
  .flecha { fill: none; stroke: var(--acento); stroke-width: 2.5; marker-end: url(#punta); }
  .flecha.total { stroke: var(--rojo); marker-end: url(#punta-roja); }
  .flecha-txt { font-size: 17px; text-anchor: middle; fill: var(--acento); font-weight: 700; }
  .flecha-txt.total { fill: var(--rojo); }
  .relleno-azul { fill: var(--azul); opacity: 0.45; }
  .quitado { fill: #fbeceb; stroke: var(--rojo); stroke-width: 2; stroke-dasharray: 6 4; }
  .valor.quita { fill: var(--rojo); font-weight: 700; }
  .valor.cambio { font-weight: 700; }
  .mult { font-size: 21px; font-weight: 700; fill: var(--acento); }
  .mult.total { fill: var(--rojo); }
  [data-para="variacion"], [data-para="original"] { flex-basis: 100%; }
  .tipos { display: grid; margin-bottom: 0.5rem; grid-template-columns: auto auto auto; gap: 0.25rem 0.4rem; align-items: center; font-size: 0.9rem; width: 100%; max-width: 34rem; }
  .tipos .cab { color: var(--suave); text-align: center; }
  .tipos .fila { text-align: right; font-weight: 700; color: var(--tinta); }
  .tipos button[aria-pressed="true"] { background: var(--acento); color: #fff; border-color: var(--acento); }
  .cuatro { border-collapse: collapse; margin: 0.6rem 0 0.2rem; font-size: 0.95em; }
  .cuatro th, .cuatro td { border: 1px solid var(--borde); padding: 0.2rem 0.7rem; text-align: center; }
  .cuatro th { font-weight: 400; color: var(--suave); }
  .cuatro td { font-weight: 700; }
  .cuatro td.actual { background: var(--azul); }
</style>
<link rel="stylesheet" href="../herramientas.css">
<script>if (window.top !== window.self) document.documentElement.classList.add("en-modal", ...(location.hash.includes("=") ? ["con-datos"] : []));</script>
</head>
<body>
<header>
  <h1>Porcentajes con la recta doble</h1>
  <a href="../">← Volver al repaso</a>
</header>

<nav class="modos" role="tablist" aria-label="Tipo de problema">
  <button type="button" role="tab" data-modo="de">El % de una cantidad</button>
  <button type="button" role="tab" data-modo="que">¿Qué porcentaje es?</button>
  <button type="button" role="tab" data-modo="variacion" id="tab-cambio">Subidas y bajadas</button>
  <button type="button" role="tab" data-modo="encadenados">Dos cambios seguidos</button>
  <button type="button" role="tab" data-modo="formas">Fracción, decimal y porcentaje</button>
</nav>

<form class="entrada" id="entrada" autocomplete="off">
  <span data-para="de">el <input id="dp" type="number" min="0.01" max="1000" step="any" aria-label="Porcentaje"> % de <input id="dt" type="number" min="1" step="any" aria-label="Cantidad"></span>
  <span data-para="que"><input id="qp" type="number" min="0" step="any" aria-label="Parte"> de <input id="qt" type="number" min="1" step="any" aria-label="Total"></span>
  <span data-para="variacion"><span class="tipos" id="tipos-variacion"></span>
    precio inicial <input id="vt" type="number" min="1" step="any" aria-label="Precio inicial">
    <select id="vs" aria-label="Aumento o descuento"><option value="baja">baja un</option><option value="sube">sube un</option></select>
    <input id="vp" type="number" min="0.01" max="500" step="any" aria-label="Porcentaje"> %</span>
  <span data-para="encadenados"><input id="et" type="number" min="1" step="any" aria-label="Cantidad inicial">
    <select id="es1" aria-label="Primer cambio"><option value="sube">sube un</option><option value="baja">baja un</option></select>
    <input id="ep1" type="number" min="0.01" max="500" step="any" class="corto" aria-label="Primer porcentaje"> % y después
    <select id="es2" aria-label="Segundo cambio"><option value="baja">baja un</option><option value="sube">sube un</option></select>
    <input id="ep2" type="number" min="0.01" max="500" step="any" class="corto" aria-label="Segundo porcentaje"> %</span>
  <span data-para="original"><span class="tipos" id="tipos-original"></span>
    precio final <input id="of" type="number" min="0.01" step="any" aria-label="Precio final">, después de
    <select id="os" aria-label="Subida o bajada"><option value="sube">subir un</option><option value="baja">bajar un</option></select>
    <input id="op" type="number" min="0.01" max="500" step="any" class="corto" aria-label="Porcentaje"> %</span>
  <span data-para="formas">
    <span class="frac-input"><input id="fn" class="corto" type="number" min="1" max="99" aria-label="Numerador"><hr><input id="fd" class="corto" type="number" min="2" max="100" aria-label="Denominador"></span>
    <select id="fdesde" aria-label="Qué se da"><option value="fraccion">se da la fracción</option><option value="porcentaje">se da el porcentaje</option></select>
  </span>
  <button type="submit" class="principal">Empezar</button>
  <div class="ejemplos" id="ejemplos"></div>
</form>

<p class="enunciado" id="enunciado"></p>
<div id="escena" class="escena" aria-hidden="true"></div>

<section class="explicacion" aria-live="polite">
  <h2 id="titulo-paso"></h2>
  <div id="texto-paso"></div>
</section>

<div class="controles">
  <button type="button" id="anterior">← Anterior</button>
  <div class="puntos" id="puntos"></div>
  <button type="button" id="siguiente" class="principal">Siguiente →</button>
</div>
<p class="ayuda">También con las flechas ← → del teclado. Los decimales se escriben con punto o con coma, según el teclado.</p>

<script src="pasos.js"></script>
<script src="porcentajes.js"></script>
<script>
"use strict";
const { svg, frac, num, X0, ANCHO, texto } = Pasos;
const pc = x => `${num(x)} %`;

// Recta doble del motor común, con los porcentajes arriba.
const rectaDoble = (g, opciones) => Pasos.rectaDoble(g, { formato: pc, ...opciones });

const QUE_ES = { 25: "la cuarta parte", 10: "la décima parte", 5: "la mitad del 10 %", 1: "la centésima parte", 0.1: "la milésima parte", 0.01: "la diezmilésima parte" };
const DIVIDE = { 25: 4, 10: 10, 5: 20, 1: 100, 0.1: 1000, 0.01: 10000 };

// -------------------------------------------------- el % de una cantidad
// Si el porcentaje es pequeño, se amplía el tramo del 0 % al `zoom` %.
function ampliacion(p, base) {
  if (p < 1) return 1;
  if (p <= 10 && base < 10) return 10;
  if (p <= 20 && base < 10) return 20;
  return 0;
}

function dibujarDe(r) {
  const { p, total, base, vBase, veces, resultado, multiplicador } = r;
  const zoom = ampliacion(p, base);
  const g = Pasos.lienzo(zoom ? 420 : 240);
  const R = rectaDoble(g, { y: 70, max: Math.max(100, zoom ? 100 : p) });
  R.marca(0, "0");
  R.marca(100, num(total));
  let Z = R;
  if (zoom) {
    R.marca(zoom, num(total * zoom / 100), "ver1");
    Z = rectaDoble(g, { y: 280, max: zoom, clase: "ver1" });
    svg("path", { d: `M ${R.x(0)} 150 L ${X0} 280 M ${R.x(zoom)} 150 L ${X0 + ANCHO} 280`, class: "union ver1" }, g);
    Z.marca(0, "0", "ver1");
    Z.marca(zoom, num(total * zoom / 100), "ver1");
  }
  // La referencia y sus repeticiones hasta el porcentaje buscado (sin
  // etiqueta, para que no se amontonen).
  if (veces > 1) Z.marca(base, num(vBase), "ver1");
  if (veces <= 40) for (let k = 2; k < veces; k++) Z.marca(k * base, "", "ver2", false, { etiqueta: "", repite: true });
  Z.marca(p, num(resultado), "ver3", true);
  const ref = base === 5 ? `El 10 % es ${num(total / 10)} (la décima parte), y el 5 % es la mitad: <b>${num(vBase)}</b>.`
    : `El ${pc(base)} es ${QUE_ES[base]}: ${num(total)} : ${DIVIDE[base]} = <b>${num(vBase)}</b>.`;
  return [
    ["Las dos rectas", `<p>Arriba, los porcentajes; abajo, las cantidades. El <b>100 %</b> es el total: ${num(total)}. El 0 % es 0.</p>`],
    ["Un porcentaje fácil", `${zoom ? `<p>El ${pc(p)} queda muy cerca del 0 %: <b>ampliamos</b> el tramo del 0 % al ${pc(zoom)}, que es ${num(total * zoom / 100)}.</p>` : ""}<p>${ref}</p>`],
    [`Hasta el ${pc(p)}`, veces > 1 ? `<p>El ${pc(p)} son ${num(veces)} veces el ${pc(base)}: vamos sumando ${num(vBase)} cada vez.</p>` : `<p>El ${pc(p)} es justo el porcentaje de referencia.</p>`],
    [`El ${pc(p)}`, `<p>El ${pc(p)} de ${num(total)} es ${veces > 1 ? `${num(veces)} · ${num(vBase)} = ` : ""}<b>${num(resultado)}</b>.</p>
      ${p > 100 ? `<p>Es <b>más que el total</b>: un porcentaje mayor que 100 % es más de una vez la cantidad.</p>` : ""}${p < 1 ? `<p>Es <b>muy poco</b>: menos de la centésima parte.</p>` : ""}`],
    ["Con la calculadora", `<p>Calcular el ${pc(p)} es multiplicar por <b>${num(multiplicador)}</b> (${num(p)} : 100): ${num(total)} · ${num(multiplicador)} = ${num(resultado)}.</p>`],
  ];
}

// ------------------------------------------------- ¿qué porcentaje es?
function dibujarQue(r) {
  const { parte, total, uno, p, decimal } = r;
  const g = Pasos.lienzo(240);
  const R = rectaDoble(g, { y: 70, max: Math.max(100, p) });
  R.marca(0, "0");
  R.marca(100, num(total));
  // El 1 % se ve si no queda pegado al 0; si no, se marca el 10 %.
  if (R.x(1) - R.x(0) >= 40) R.marca(1, num(uno), "ver1"); else R.marca(10, num(total / 10), "ver1");
  R.marca(p, num(parte), "hasta2", true, { etiqueta: "?" });
  R.marca(p, num(parte), "ver2", true, { repite: true });
  return [
    ["Lo que sabemos", `<p>El total, ${num(total)}, es el 100 %. Queremos saber qué porcentaje es <b>${num(parte)}</b>.</p>`],
    ["El 1 %", `<p>El 1 % es la centésima parte del total: ${num(total)} : 100 = <b>${num(uno)}</b>${R.x(1) - R.x(0) >= 40 ? "" : ` (en la recta, el 10 %: ${num(total / 10)})`}.</p>`],
    ["¿Cuántas veces el 1 %?", `<p>${num(parte)} es ${num(parte)} : ${num(uno)} = <b>${num(p)}</b> veces el 1 %: es el <b>${pc(p)}</b>.</p>${p > 100 ? "<p>Es más que el total: más del 100 %.</p>" : ""}`],
    ["Otra forma", `<p>Como fracción: ${frac(num(parte), num(total))} = ${num(decimal)} = <b>${pc(p)}</b> (el decimal multiplicado por 100).</p>`],
  ];
}

// Puntas de flecha (azul y roja) para .flecha y .flecha.total.
function puntas(g) {
  const defs = svg("defs", {}, g);
  for (const [id, color] of [["punta", "var(--acento)"], ["punta-roja", "var(--rojo)"]]) {
    const mk = svg("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
    svg("path", { d: "M 0 0 L 10 5 L 0 10 z", style: `fill: ${color}` }, mk);
  }
}

// --------------------------------------------------- subidas y bajadas
// Cuatro tipos: sube o baja, y se conoce el precio inicial (modo variacion)
// o el final (modo original). Los dos modos comparten el dibujo: dos barras
// con la misma escala, arriba el precio inicial (el 100 %) y abajo el final
// (el 100 % más la subida, en naranja, o lo que queda tras quitar el
// descuento, en rojo). La flecha de arriba abajo es × multiplicador; la de
// vuelta, : multiplicador.
const mult = x => String(x).replace(".", ",");   // sin redondear (×0,875)
const din = x => num(x).replace(/,(\d)$/, ",$10");   // dinero, con céntimos: 10,20
const eur = x => `${din(x)} €`;
const XB = 150, WB = 420, YA = 70, YB = 220, H = 56;

// Cuadrícula de los cuatro tipos en el cuadro de datos de los dos modos: al
// pulsar uno, se conservan el precio escrito y el porcentaje.
const CAMPOS_CAMBIO = { variacion: ["vt", "vp", "total"], original: ["of", "op", "final"] };
const botonesTipo = [];
for (const [modo, conocido] of [["variacion", "inicial"], ["original", "final"]]) {
  const caja = document.getElementById("tipos-" + modo);
  const celda = (t, clase) => { const n = document.createElement("span"); n.className = clase; n.textContent = t; caja.appendChild(n); };
  celda("", "");
  celda("conocemos el precio inicial", "cab");
  celda("conocemos el precio final", "cab");
  for (const sube of [true, false]) {
    celda(sube ? "Sube" : "Baja", "cab fila");
    for (const [destino, cdestino] of [["variacion", "inicial"], ["original", "final"]]) {
      const bt = document.createElement("button");
      bt.type = "button";
      bt.textContent = `${sube ? "sube" : "baja"}, ¿precio ${cdestino === "inicial" ? "final" : "inicial"}?`;
      bt.addEventListener("click", () => {
        const [precio, p] = CAMPOS_CAMBIO[modo].map(id => Number(document.getElementById(id).value));
        elegirModo(destino, { [CAMPOS_CAMBIO[destino][2]]: precio, p, sentido: sube ? "sube" : "baja" });
      });
      caja.appendChild(bt);
      botonesTipo.push({ bt, conocido: cdestino, sube });
    }
  }
}
function marcarTipo(conocido, sube) {
  for (const b of botonesTipo) b.bt.setAttribute("aria-pressed", b.conocido === conocido && b.sube === sube);
  document.getElementById("tab-cambio").setAttribute("aria-selected", "true");   // una sola pestaña para los dos modos
}

// Los cuatro casos con este porcentaje, con el actual resaltado.
function cuatroCasos(p, conocido, sube) {
  const fila = s => {
    const m = s ? mult(Math.round((100 + p) * 1e7) / 1e9) : p < 100 ? mult(Math.round((100 - p) * 1e7) / 1e9) : null;
    const td = (c, op) => `<td class="${c === conocido && s === sube ? "actual" : ""}">${m === null ? "—" : `${op} ${m}`}</td>`;
    return `<tr><th>${s ? "Sube" : "Baja"} un ${pc(p)}</th>${td("inicial", "×")}${td("final", ":")}</tr>`;
  };
  return `<table class="cuatro"><tr><th></th><th>Conocemos el inicial</th><th>Conocemos el final</th></tr>${fila(true)}${fila(false)}</table>`;
}

function dibujarCambio({ I, F, p, sube, pf, m, conocido, malo }) {
  const inicial = conocido === "inicial", c = I * p / 100, s = sube ? "+" : "−";
  marcarTipo(conocido, sube);
  const g = Pasos.lienzo(340), esc = WB / Math.max(100, pf), x = v => XB + v * esc;
  puntas(g);
  // Un tramo de barra con su porcentaje dentro o, si no cabe, encima.
  const tramo = (padre, y, de, a, clase, rotulo, claseTxt = "") => {
    svg("rect", { x: x(de), y, width: (a - de) * esc, height: H, class: clase }, padre);
    const cabe = (a - de) * esc >= 64;
    texto(padre, { x: (x(de) + x(a)) / 2, y: cabe ? y + H / 2 : y - 14, t: rotulo, clase: `valor ${claseTxt}` });
    return cabe;
  };
  // Arriba, el precio inicial.
  texto(g, { x: 40, y: YA + H / 2 + 5, t: "Precio inicial", clase: "rotulo-barra", ancla: "start" });
  tramo(g, YA, 0, 100, "parte azul", "100 %");
  svg("rect", { x: x(0), y: YA, width: 100 * esc, height: H, class: "contorno" }, g);
  Pasos.llave(g, { x1: x(0), x2: x(100), y: YA, arriba: true, texto: `100 % = ${inicial ? eur(I) : "?"}`, clase: inicial ? "" : "hasta2" });
  if (!inicial) Pasos.llave(g, { x1: x(0), x2: x(100), y: YA, arriba: true, texto: `100 % = ${eur(I)}`, clase: "ver2" });
  // Abajo, el precio final: el 100 % y lo que sube, o lo que queda y lo que se quita.
  const abajo = svg("g", { class: inicial ? "ver1" : "" }, g);
  texto(abajo, { x: 40, y: YB + H / 2 + 5, t: "Precio final", clase: "rotulo-barra", ancla: "start" });
  svg("line", { x1: x(100), y1: YA + H, x2: x(100), y2: YB + H, class: "union" }, abajo);
  tramo(abajo, YB, 0, sube ? 100 : pf, "parte azul", pc(sube ? 100 : pf));
  const cabe = tramo(abajo, YB, sube ? 100 : pf, sube ? pf : 100, sube ? "parte naranja" : "quitado", `${s}${pc(p)}`, sube ? "" : "quita");
  svg("rect", { x: x(0), y: YB, width: pf * esc, height: H, class: "contorno" }, abajo);
  const cambio = svg("g", { class: inicial ? "ver1" : "ver2" }, g);
  texto(cambio, { x: (x(100) + x(pf)) / 2, y: YB - (cabe ? 14 : 36), t: `${s}${eur(c)}`, clase: "valor cambio" + (sube ? "" : " quita") });
  Pasos.llave(g, { x1: x(0), x2: x(pf), y: YB, arriba: false, texto: `${pc(pf)} = ${eur(F)}`, clase: inicial ? "ver2" : "" });
  // Las flechas: × multiplicador hacia abajo y, si se conoce el final, : multiplicador de vuelta.
  const xf = XB + WB + 45, ym = (YA + YB + H) / 2;
  const flecha = (xx, y1, y2, txt, clase) => {
    const f = svg("g", { class: "ver3" }, g);
    svg("path", { d: `M ${xx} ${y1} L ${xx} ${y2}`, class: "flecha " + clase }, f);
    texto(f, { x: xx + 12, y: ym + 7, t: txt, clase: "mult " + clase, ancla: "start" });
  };
  flecha(xf, YA + 10, YB + H - 10, `× ${mult(m)}`, "");
  if (!inicial) flecha(xf + 95, YB + H - 10, YA + 10, `: ${mult(m)}`, "total");

  const tabla = cuatroCasos(p, conocido, sube);
  const quitar = sube ? "la subida" : "el descuento";
  if (inicial) return [
    ["El precio inicial es el 100 %", `<p>La barra de arriba es el precio inicial: <b>${eur(I)}</b>, el <b>100 %</b>.</p>`],
    [sube ? "Lo que sube" : "Lo que se descuenta", `<p>La barra de abajo es el precio final: la de arriba ${sube ? "<b>más</b> un trozo naranja, lo que sube" : "<b>menos</b> un trozo, el descuento"}. Ese trozo es el ${pc(p)} del precio inicial: ${din(I)} · ${mult(p / 100)} = <b>${eur(c)}</b>.</p>`],
    ["El precio final", `<p>${din(I)} ${s} ${din(c)} = <b>${eur(F)}</b>. La barra de abajo es el 100 % ${s} ${pc(p)} = <b>${pc(pf)}</b> del precio inicial.</p>`],
    ["En un solo paso: multiplicar", `<p>Pasar del 100 % al ${pc(pf)} es multiplicar por ${num(pf)} : 100 = <b>${mult(m)}</b>: ${din(I)} · ${mult(m)} = <b>${eur(F)}</b>. ${sube ? "Es mayor que 1: el precio crece." : "Es menor que 1: el precio baja."}</p>${tabla}`],
  ];
  const uno = F / pf, unoExacto = Math.abs(uno * 100 - Math.round(uno * 100)) < 1e-9;
  return [
    ["Lo que sabemos", `<p>La barra de abajo es el precio final, <b>${eur(F)}</b>: ${sube ? `el precio inicial más la subida del ${pc(p)}` : `lo que queda del precio inicial al quitarle el ${pc(p)}`}. Es el 100 % ${s} ${pc(p)} = <b>${pc(pf)}</b>.</p><p>La barra de arriba, el precio inicial, es el 100 %: es lo que buscamos.</p>`],
    ["El 1 %", `<p>Si ${eur(F)} son el ${pc(pf)}, el 1 % es ${din(F)} : ${num(pf)} = <b>${din(uno)}${unoExacto ? "" : "…"} €</b>.</p>`],
    ["El 100 %", `<p>El precio inicial es el 100 %: 100 · ${din(uno)}${unoExacto ? "" : "…"} = <b>${eur(I)}</b>.</p><p>Comprobación: ${quitar} es el ${pc(p)} de ${din(I)}, ${eur(c)}, y ${din(I)} ${s} ${din(c)} = ${din(F)}.</p>`],
    ["En un solo paso: dividir", `<p>Del precio inicial al final se <b>multiplica</b> por ${mult(m)} (flecha azul): precio inicial · ${mult(m)} = ${din(F)}.</p><p>Para volver del final al inicial se deshace: se <b>divide</b> entre ${mult(m)} (flecha roja). ${din(F)} : ${mult(m)} = <b>${eur(I)}</b>.</p>${tabla}`],
    ["El error típico", `<p>${sube ? "Restar" : "Sumar"} el ${pc(p)} a ${din(F)} da ${eur(malo)}, y no ${eur(I)}: el ${pc(p)} es del precio inicial (la barra de arriba), no del final. ${sube ? "La subida" : "El descuento"} es ${eur(c)}, no ${eur(F * p / 100)}.</p>`],
  ];
}

const dibujarVariacion = r => dibujarCambio({ I: r.total, F: r.resultado, p: r.p, sube: r.sentido === "sube", pf: r.pFinal, m: r.multiplicador, conocido: "inicial" });
const dibujarOriginal = r => dibujarCambio({ I: r.inicio, F: r.final, p: r.p, sube: r.sentido === "sube", pf: r.pFinal, m: r.m, conocido: "final", malo: r.malo });

// --------------------------------------------------- dos cambios seguidos
const signo = (s, p) => `${s === "sube" ? "+" : "−"}${pc(p)}`;
function dibujarEncadenados(r) {
  const { total, p1, s1, p2, s2, m1, m2, medio, final: fin, m, cambio, sumado, siSumara } = r;
  const g = Pasos.lienzo(300), y = 110, xs = [130, 400, 670];
  puntas(g);
  const caja = (x, v, clase) => { const c = svg("g", { class: clase }, g); svg("rect", { x: x - 85, y: y - 32, width: 170, height: 64, rx: 8, class: "caja-valor" }, c); texto(c, { x, y, t: num(v), clase: "valor-caja" }); };
  caja(xs[0], total, "");
  caja(xs[1], medio, "ver1");
  caja(xs[2], fin, "ver2");
  const flecha = (x1, x2, txt, clase) => { const f = svg("g", { class: clase }, g); svg("path", { d: `M ${x1 + 88} ${y} L ${x2 - 90} ${y}`, class: "flecha" }, f); texto(f, { x: (x1 + x2) / 2, y: y - 44, t: txt, clase: "flecha-txt" }); };
  flecha(xs[0], xs[1], `${signo(s1, p1)} = ×${num(m1)}`, "ver1");
  flecha(xs[1], xs[2], `${signo(s2, p2)} = ×${num(m2)}`, "ver2");
  const tot = svg("g", { class: "ver3" }, g);
  svg("path", { d: `M ${xs[0]} ${y + 36} Q ${xs[1]} ${y + 150} ${xs[2]} ${y + 38}`, class: "flecha total" }, tot);
  texto(tot, { x: xs[1], y: y + 120, t: `×${num(m1)} · ${num(m2)} = ×${num(m)}`, clase: "flecha-txt total" });
  const efecto = cambio === 0 ? "no cambia" : `${cambio > 0 ? "sube" : "baja"} un ${pc(Math.abs(cambio))}`;
  return [
    ["El punto de partida", `<p>Empezamos con <b>${num(total)}</b>. Primero ${s1 === "sube" ? "sube" : "baja"} un ${pc(p1)} y después ${s2 === "sube" ? "sube" : "baja"} un ${pc(p2)}.</p>`],
    ["El primer cambio", `<p>${s1 === "sube" ? "Subir" : "Bajar"} un ${pc(p1)} es multiplicar por <b>${num(m1)}</b>: ${num(total)} · ${num(m1)} = <b>${num(medio)}</b>.</p>`],
    ["El segundo, sobre lo nuevo", `<p>El ${pc(p2)} se calcula sobre <b>${num(medio)}</b>, no sobre ${num(total)}: ${num(medio)} · ${num(m2)} = <b>${num(fin)}</b>.</p>`],
    ["Un solo multiplicador", `<p>Los dos cambios equivalen a multiplicar por ${num(m1)} · ${num(m2)} = <b>${num(m)}</b>: en total, ${efecto}.</p>`],
    ["El error típico", `<p>Sumar los porcentajes (${signo(s1, p1)} ${s2 === "sube" ? "+" : "−"} ${pc(p2)} = ${sumado > 0 ? "+" : sumado < 0 ? "−" : ""}${pc(Math.abs(sumado))}) daría ${num(siSumara)}, ${siSumara === fin ? "que aquí coincide por casualidad" : `y no ${num(fin)}`}. Los porcentajes seguidos <b>no se suman</b>: se multiplican sus multiplicadores.</p>`],
  ];
}

// ------------------------------------------- fracción, decimal y porcentaje
// La barra entera es 1, el 100 %: d trozos y n pintados. Desde el porcentaje,
// los cortes aparecen al llegar a la fracción.
function dibujarFormas(r) {
  const { n, d, desde, ns, ds, dec, pc: p } = r, y = 100, deFr = desde === "fraccion";
  const ex = x => String(Math.round(x * 1e6) / 1e6).replace(".", ",");   // sin redondear a dos decimales (3/8 = 0,375)
  const [bn, bd] = deFr ? [n, d] : [ns, ds];   // desde el %, la barra ya en la fracción simplificada
  const g = Pasos.lienzo(230);
  const t = Pasos.barra(g, { y, partes: bd, color: k => k < bn ? "azul" : "blanco", cortes: deFr ? "" : "ver2" });
  const xn = X0 + bn * t, F = frac(n, d);
  texto(g, { x: X0 + ANCHO, y: y - 14, t: deFr ? "1 = 100 %" : "100 %", clase: "rotulo-llave suave " + (deFr ? "ver2" : ""), ancla: "end" });
  Pasos.llave(g, { x1: X0, x2: xn, y, arriba: true, texto: pc(p), clase: deFr ? "ver2" : "" });
  Pasos.llave(g, { x1: X0, x2: xn, y, arriba: false, texto: `${bn}/${bd}`, clase: deFr ? "" : "ver2" });
  texto(g, { x: X0 + ANCHO / 2, y: y + 120, t: deFr ? `${n} : ${d} = ${ex(dec)}` : `${pc(p)} = ${ex(p)} : 100 = ${ex(dec)}`, clase: "rotulo-llave ver1" });
  const sobre100 = Number.isInteger(p) ? frac(p, 100) : frac(p * 10, 1000);
  const simpl = !Number.isInteger(p) || ds !== 100 ? ` = ${frac(ns, ds)}` : "";
  const fin = ["Las tres formas", `<p>${frac(ns, ds)} = <b>${ex(dec)}</b> = <b>${pc(p)}</b>: es la misma cantidad escrita de tres maneras.</p>`];
  if (deFr) return [
    ["La fracción", `<p>La barra entera es 1. Está cortada en ${d} trozos iguales y hay ${n} pintados: ${F}.</p>`],
    ["El decimal", `<p>Una fracción es una división: ${n} : ${d} = <b>${ex(dec)}</b>.</p>`],
    ["El porcentaje", `<p>Porcentaje quiere decir «de cada 100». La barra entera es el 100 %, así que ${ex(dec)} · 100 = <b>${pc(p)}</b>.</p>`],
    fin,
  ];
  return [
    ["El porcentaje", `<p>${pc(p)} quiere decir ${ex(p)} de cada 100. La barra entera es el 100 %.</p>`],
    ["El decimal", `<p>${ex(p)} de cada 100 es ${ex(p)} : 100 = <b>${ex(dec)}</b>.</p>`],
    ["La fracción", `<p>${pc(p)} = ${sobre100}${Number.isInteger(p) ? "" : ` (multiplicando arriba y abajo por 10 para quitar la coma)`}${simpl}. Simplificada: la barra queda en ${ds} trozos y hay ${ns} pintados.</p>`],
    fin,
  ];
}

const MODOS = {
  de: { campos: { p: "dp", total: "dt" }, dibujar: dibujarDe },
  que: { campos: { parte: "qp", total: "qt" }, dibujar: dibujarQue },
  variacion: { campos: { total: "vt", sentido: "vs", p: "vp" }, dibujar: dibujarVariacion },
  encadenados: { campos: { total: "et", s1: "es1", p1: "ep1", s2: "es2", p2: "ep2" }, dibujar: dibujarEncadenados },
  original: { campos: { final: "of", sentido: "os", p: "op" }, dibujar: dibujarOriginal },
  formas: { campos: { n: "fn", d: "fd", desde: "fdesde" }, dibujar: dibujarFormas },
};
for (const [m, def] of Object.entries(MODOS))
  Object.assign(def, { calcular: Porcentajes.calcular[m], ejemplos: Porcentajes.EJEMPLOS[m], azar: () => Porcentajes.azar(m) });
const elegirModo = Pasos.montar(MODOS, "de");
</script>

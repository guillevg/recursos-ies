<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jerarquía de las operaciones</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.bunny.net">
<link rel="stylesheet" href="https://fonts.bunny.net/css?family=figtree:400,600,800&display=swap">
<link rel="stylesheet" href="pasos.css">
<style>
  .entrada input[type="text"] { width: min(32rem, 100%); font-size: 1.2rem; }
  .lineas { display: flex; flex-direction: column; align-items: center; gap: 0.35rem; padding: 0.5rem 0; }
  /* En línea, no flex: en un flex cada <sup> sería un bloque suelto, al lado y del mismo tamaño. */
  .linea { font-size: 1.6rem; text-align: center; line-height: 1.8; }
  .linea .igual { color: var(--suave); margin: 0 0.3em; }
  .marcada { background: color-mix(in srgb, var(--naranja) 55%, transparent); border-radius: 6px; padding: 0 0.15em; }
  .resultado { font-weight: 700; color: var(--acento); }
  .linea.final { font-size: 1.9rem; }
  body.proyectando .linea { font-size: 2.4rem; }
  body.proyectando .linea.final { font-size: 2.8rem; }
  .entrada input[type="number"] { width: 5.5rem; }
  .fuera { color: var(--acento); font-weight: 700; }
  .bien { color: #1e7d43; font-weight: 700; }
  .mal { color: var(--rojo); font-weight: 700; }
  @media (max-width: 640px) { .linea { font-size: 1.15rem; } .linea.final { font-size: 1.35rem; } }
</style>
<link rel="stylesheet" href="../herramientas.css">
<script>if (window.top !== window.self) document.documentElement.classList.add("en-modal", ...(location.hash.includes("=") ? ["con-datos"] : []));</script>
</head>
<body>
<header>
  <h1>Jerarquía de las operaciones</h1>
  <a href="../">← Volver al repaso</a>
</header>

<nav class="modos" role="tablist" aria-label="Qué hacer">
  <button type="button" role="tab" data-modo="resolver">Resolver una expresión</button>
  <button type="button" role="tab" data-modo="inversa">Comprobar con la operación inversa</button>
  <button type="button" role="tab" data-modo="factorComun">Sacar factor común</button>
</nav>

<form class="entrada" id="entrada" autocomplete="off">
  <span data-para="resolver">
    <label for="ex">Expresión:</label>
    <input id="ex" type="text" spellcheck="false" aria-describedby="como">
  </span>
  <span data-para="inversa">
    <select id="io" aria-label="Operación"><option value="resta">a − b = c</option><option value="division">a : b = c</option><option value="raiz">√a = c</option></select>
    a <input id="ia" type="number" min="0" max="999999" aria-label="a">
    b <input id="ib" type="number" min="0" max="999999" aria-label="b (no se usa en la raíz)">
    c <input id="ic" type="number" min="0" max="999999" aria-label="c, el resultado que hay que comprobar">
  </span>
  <span data-para="factorComun">
    a · b ± a · c con a = <input id="fa" type="number" min="1" max="9999" aria-label="a, el factor común">,
    b = <input id="fb" type="number" min="1" max="9999" aria-label="b">
    <select id="fo" aria-label="Operación"><option value="+">+</option><option value="−">−</option></select>
    c = <input id="fc" type="number" min="1" max="9999" aria-label="c">
  </span>
  <button type="submit" class="principal">Empezar</button>
  <div class="ejemplos" id="ejemplos"></div>
</form>

<p class="enunciado" id="enunciado"></p>
<div id="escena" class="escena" aria-hidden="true"></div>

<section class="explicacion" aria-live="polite">
  <h2 id="titulo-paso"></h2>
  <div id="texto-paso"></div>
</section>

<div class="controles">
  <button type="button" id="anterior">← Anterior</button>
  <div class="puntos" id="puntos"></div>
  <button type="button" id="siguiente" class="principal">Siguiente →</button>
</div>
<p class="ayuda" id="como">Escribe · o * para multiplicar, : para dividir, 3/4 para una fracción, 2,5 para un decimal y (−3) para un número negativo. También con las flechas ← → del teclado.</p>

<script src="pasos.js"></script>
<script src="jerarquia.js"></script>
<script>
"use strict";
const { frac } = Pasos;
const val = q => Jerarquia.comoDecimal(q) ?? Jerarquia.escribirQ(q);
// Número escrito: fracción apilada si es una fracción.
function numero(txt) {
  const m = txt.match(/^(−?)(\d+)\/(\d+)$/);
  return m ? `${m[1]}${frac(m[2], m[3])}` : txt;
}
// Expresión en HTML, con la operación de `camino` resaltada.
function html(n, camino) {
  const marcar = (s, aqui) => aqui ? `<span class="marcada">${s}</span>` : s;
  const rec = (m, ruta) => {
    const aqui = camino && ruta.length === camino.length && ruta.every((k, i) => k === camino[i]);
    if (m.tipo === "num") return numero(m.txt);
    if (m.tipo === "par") { const [a, c] = { "[": "[]", "{": "{}" }[m.forma] ?? "()"; return marcar(`${a}${rec(m.dentro, [...ruta, "dentro"])}${c}`, aqui); }
    return marcar(`${rec(m.izq, [...ruta, "izq"])} ${m.op} ${rec(m.der, [...ruta, "der"])}`, aqui);
  };
  return rec(n, []);
}
const POR_QUE = {
  parentesis: "Primero, lo que está <b>entre paréntesis</b>.",
  prioridad: "Las <b>multiplicaciones y divisiones</b> van antes que las sumas y restas.",
  izquierda: "Entre operaciones del mismo nivel, <b>de izquierda a derecha</b>.",
  unica: "Es la única operación que queda.",
};
const NOMBRE = { "+": "suma", "−": "resta", "·": "multiplicación", ":": "división" };

function dibujar(r) {
  const { arbol, pasos, resultado, alReves } = r;
  const escena = document.getElementById("escena");
  escena.className = "escena";
  const lineas = pasos.map((p, k) => `<div class="linea ver${k}">${k ? '<span class="igual">=</span>' : ""}${html(p.arbol, p.camino)}</div>`);
  lineas.push(`<div class="linea final ver${pasos.length}"><span class="igual">=</span><span class="resultado">${numero(Jerarquia.escribirQ(resultado))}</span></div>`);
  escena.innerHTML = `<div class="lineas">${lineas.join("")}</div>`;
  const par = s => s.startsWith("−") ? `(${numero(s)})` : numero(s);
  const textos = pasos.map(p => [`La ${NOMBRE[p.op]}`, `<p>${POR_QUE[p.porque]}</p><p>${numero(p.ta)} ${p.op} ${par(p.tb)} = <b>${numero(p.tr)}</b></p>`]);
  const distinto = alReves && (alReves.n !== resultado.n || alReves.d !== resultado.d);
  // Con fracciones, el resultado «al revés» también se escribe como fracción.
  const conFracciones = JSON.stringify(arbol, (k, v) => typeof v === "bigint" ? String(v) : v).includes('"fraccion":true');
  const escr = q => conFracciones && q.d !== 1n ? Jerarquia.escribirQ(q) : val(q);
  const dec = Jerarquia.comoDecimal(resultado);
  textos.push(["Resultado", `<p>El resultado es <b>${numero(Jerarquia.escribirQ(resultado))}</b>${dec && resultado.d !== 1n ? ` = ${dec}` : ""}.</p>
    ${distinto ? `<p>Si se operara de izquierda a derecha, sin respetar la jerarquía, saldría ${numero(escr(alReves))}: <b>otro número</b>. El orden de las operaciones cambia el resultado.</p>` : pasos.length > 1 ? "<p>Aquí, operar de izquierda a derecha daría lo mismo, pero no siempre es así.</p>" : ""}`]);
  if (!pasos.length) textos[0][0] = "Ya es un número";
  return textos;
}

// Escena de líneas (como la de resolver): cada una aparece en su paso.
function lineas(ls) {
  const escena = document.getElementById("escena");
  escena.className = "escena";
  escena.innerHTML = `<div class="lineas">${ls.map(([html, k, extra = ""]) => `<div class="linea ${extra} ver${k}">${html}</div>`).join("")}</div>`;
}
const igual = '<span class="igual">=</span>';

// --------------------------------------------- comprobar con la operación inversa
function dibujarInversa(r) {
  const { operacion, a, b, c, real, valor, debe } = r, bien = valor === debe;
  const dicho = operacion === "raiz" ? `√${a} = ${c}` : `${a} ${r.op} ${b} = ${c}`;
  const deshacer = operacion === "raiz" ? `${c}<sup>2</sup>` : `${c} ${r.inv} ${b}`;
  const nombre = { resta: "una resta", division: "una división", raiz: "una raíz cuadrada" }[operacion];
  const regla = { resta: "La resta se deshace con una <b>suma</b>: si a − b = c, entonces c + b tiene que dar a.",
                  division: "La división se deshace con una <b>multiplicación</b>: si a : b = c, entonces c · b tiene que dar a.",
                  raiz: "La raíz cuadrada se deshace <b>elevando al cuadrado</b>: si √a = c, entonces c<sup>2</sup> tiene que dar a." }[operacion];
  lineas([
    [`¿${dicho}?`, 0, "final"],
    [deshacer, 1],
    [`${deshacer} ${igual} <span class="resultado">${valor}</span>`, 2],
    [bien ? `<span class="bien">${valor} = ${debe} ✓</span>` : `<span class="mal">${valor} ≠ ${debe} ✗</span>`, 3, "final"],
  ]);
  return [
    ["Lo que hay que comprobar", `<p>Alguien ha calculado ${nombre}: <b>${dicho}</b>. Para saber si es correcto, sin repetir la misma cuenta, se usa la operación inversa.</p>`],
    ["La operación inversa", `<p>${regla}</p>`],
    ["La cuenta", `<p>${deshacer} = <b>${valor}</b>.</p>`],
    ["¿Coincide?", bien ? `<p>Sale ${debe}, el número del principio: la operación <b>es correcta</b>.</p>`
                        : `<p>Tendría que salir ${debe} y sale ${valor}: la operación <b>está mal</b>. Lo correcto es ${operacion === "raiz" ? `√${a} = ${real}` : `${a} ${r.op} ${b} = ${real}`}.</p>`],
  ];
}

// ------------------------------------------------------- sacar factor común
function dibujarFactor(r) {
  const { a, b, c, op, s, resultado } = r, f = `<span class="fuera">${a}</span>`;
  const mental = s === 10 || s === 100 || s === 1000 ? `Multiplicar por ${s} es añadir ${String(s).length - 1 === 1 ? "un cero" : `${String(s).length - 1} ceros`}.`
    : s === 1 ? "Multiplicar por 1 deja el número igual." : "";
  lineas([
    [`${a} · ${b} ${op} ${a} · ${c}`, 0],
    [`<span class="marcada">${a}</span> · ${b} ${op} <span class="marcada">${a}</span> · ${c}`, 1],
    [`${igual}${f} · (${b} ${op} ${c})`, 2],
    [`${igual}${f} · ${s}`, 3],
    [`${igual}<span class="resultado">${Pasos.num(resultado)}</span>`, 4, "final"],
  ]);
  return [
    ["La expresión", `<p>${a} · ${b} ${op} ${a} · ${c}: hacer las dos multiplicaciones es largo. Hay un camino más corto.</p>`],
    ["El factor que se repite", `<p>El <b>${a}</b> está en los dos productos: es el <b>factor común</b>.</p>`],
    ["Lo sacamos fuera", `<p>Se escribe una sola vez, fuera del paréntesis, y dentro quedan los otros dos números: ${a} · (${b} ${op} ${c}). Es la propiedad distributiva al revés.</p>`],
    ["El paréntesis", `<p>${b} ${op} ${c} = <b>${s}</b>: una cuenta fácil.</p>`],
    ["La multiplicación", `<p>${a} · ${s} = <b>${Pasos.num(resultado)}</b>. ${mental}</p>`],
  ];
}

const MODOS = {
  resolver: { campos: { expresion: "ex" }, dibujar },
  inversa: { campos: { operacion: "io", a: "ia", b: "ib", c: "ic" }, dibujar: dibujarInversa },
  factorComun: { campos: { a: "fa", b: "fb", op: "fo", c: "fc" }, dibujar: dibujarFactor },
};
for (const [m, def] of Object.entries(MODOS))
  Object.assign(def, { calcular: Jerarquia.calcular[m], ejemplos: Jerarquia.EJEMPLOS[m], azar: () => Jerarquia.azar(m) });
const elegirModo = Pasos.montar(MODOS, "resolver");
</script>
</body>
</html>

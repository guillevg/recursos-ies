<style>
  main {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));
    gap: 1.25rem;
    padding: 1rem;
    max-width: 70rem;
    margin: 0 auto;
  }
  .juego {
    display: grid;
    justify-items: center;
    gap: .75rem;
    padding: 1.75rem 1rem;
    background: var(--tarjeta);
    border: 2px solid var(--linea);
    border-radius: 1.25rem;
    color: var(--tinta);
    text-decoration: none;
    font-size: 1.35rem;
    font-weight: 600;
  }
  .juego:hover { border-color: var(--acento); }
  .juego:active { transform: scale(.98); }
  .juego svg { width: 6rem; height: 6rem; }
</style>
